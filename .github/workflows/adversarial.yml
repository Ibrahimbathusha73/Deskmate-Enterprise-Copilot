name: Adversarial Robustness Gate

on:
  pull_request:
    branches:
      - main

jobs:
  run-adversarial:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion & Rebuild Index
        run: |
          python ingestion/chunk_and_embed.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Run Adversarial Evaluation
        run: |
          python eval/run_adversarial.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
