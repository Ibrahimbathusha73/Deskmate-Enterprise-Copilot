name: Eval Gate

on:
  pull_request:
    branches:
      - main

jobs:
  run-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create VertexAI Mock Module
        run: |
          # Inject mock to bypass Ragas 0.4.3 top-level unconditional import bug in CI
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          mkdir -p "$SITE_PACKAGES/langchain_community/chat_models"
          echo "class ChatVertexAI: pass" > "$SITE_PACKAGES/langchain_community/chat_models/vertexai.py"

      - name: Run Ingestion & Rebuild Index
        run: |
          # Ingest data and construct local vector database
          python ingestion/chunk_and_embed.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Run Ragas Evaluation
        run: |
          # Execute multi-agent runs and score using Ragas with Groq judge
          python eval/run_ragas.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Check Evaluation Thresholds
        run: |
          # Assert quality gate thresholds
          python eval/check_thresholds.py
